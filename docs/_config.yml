title: Realmwatch
description: >-
  A fantasy-themed homelab network monitor with an RPG game layer and an
  in-tree MCP server. 47 plugins, an interactive SVG realm map, a unified
  `realm` CLI with 40+ verbs, an AI oracle, a herald daemon, a Zabbix-class
  alerting pipeline, quests, progression, combat-ward, codex, and the
  Astral Conduit. All from a single Linux box.
url: https://realm.watch
theme: jekyll-theme-minimal

# Repository metadata
repository: jphein/realmwatch
github:
  repository_url: https://github.com/jphein/realmwatch

# Build
markdown: kramdown
highlighter: rouge

# Path hygiene — keep codex/runbooks/superpowers as raw browseable Markdown
# but skip them from the navigation index so the landing page stays tidy.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gem"
  - "*.gemspec"
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - superpowers
