<div class="updates-header" id="updates-header">
  <div class="updates-summary">
    <span class="updates-badge updates-badge--warded" id="updates-warded">--</span>
    <span class="updates-badge updates-badge--pending" id="updates-pending" style="display:none">0 pending</span>
    <span class="updates-badge updates-badge--failed" id="updates-failed" style="display:none">0 failed</span>
  </div>
  <div class="updates-actions">
    <button class="updates-btn updates-btn--check" id="updates-check-all" title="Check all sources">Check</button>
    <button class="updates-btn updates-btn--run" id="updates-run-all" title="Update all sources">Update All</button>
  </div>
</div>
<div class="updates-body" id="updates-body">
  <div class="updates-loading">Awaiting first scan...</div>
</div>
