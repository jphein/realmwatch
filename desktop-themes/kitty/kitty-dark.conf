# ══════════════════════════════════════════════════════════════
#   REALM KITTY — Fantasy Terminal of the Realm
#   Inspired by realm.watch
# ══════════════════════════════════════════════════════════════

# ── Font ──
font_family      Ubuntu Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ── Window: the Grimoire frame ──
background_opacity 0.88
dynamic_background_opacity yes
window_padding_width 10 14
remember_window_size yes
initial_window_width  120c
initial_window_height 36c
confirm_os_window_close 0
linux_display_server wayland
window_border_width 1pt
active_border_color   #d4a050
inactive_border_color #2a1a3a
draw_minimal_borders  yes

# ── Colors: The Gem Treasury ──
foreground #d4a574
background #0e0818

# Cursor: molten gold
cursor           #f0d080
cursor_text_color #0e0818
cursor_shape     beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_trail 0

# Selection: deep amber
selection_foreground #f0e0c8
selection_background #4a3020

# Marks
mark1_foreground #0e0818
mark1_background #d4a050
mark2_foreground #0e0818
mark2_background #80e8a0
mark3_foreground #0e0818
mark3_background #d0a0ff

# URL underline: gold
url_color #d4a050
url_style curly

# ── ANSI: Gem Palette ──
# Black (void)
color0  #1a1028
color8  #4a3a5a

# Red (ruby)
color1  #dc5a55
color9  #ff9090

# Green (emerald)
color2  #50b470
color10 #80e8a0

# Yellow (gold)
color3  #d4a050
color11 #f0d080

# Blue (sapphire)
color4  #5a8cc0
color12 #90c8ff

# Magenta (amethyst)
color5  #b080d0
color13 #d0a0ff

# Cyan (teal)
color6  #40b8a8
color14 #70e8d8

# White (parchment)
color7  #c8a888
color15 #f0e0c8

# ── Scrollback ──
scrollback_lines 50000
scrollback_pager_history_size 64
scrollback_pager less -R +G
wheel_scroll_multiplier 3.0
scroll_on_output no

# ── Bell: arcane flash ──
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #3a2818
bell_on_tab "✦ "

# ── Tab Bar: Realm Rune Bar ──
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        1
tab_bar_background      #0a0510
tab_bar_margin_height   2 0
tab_title_max_length    32
tab_title_template      " {index}: {(tab.active_wd or '/').replace('/home/jp', '~').rsplit('/', 1)[-1] or '~'} "
active_tab_title_template " {index}: {(tab.active_wd or '/').replace('/home/jp', '~').rsplit('/', 1)[-1] or '~'} "
active_tab_foreground   #f0d080
active_tab_background   #2a1838
active_tab_font_style   bold
inactive_tab_foreground #8a7a68
inactive_tab_background #12081a
inactive_tab_font_style normal
tab_activity_symbol     "✦"

# ── Keyboard Shortcuts ──
# Scrollback (works even in alternate screen / Claude Code)
map ctrl+shift+h show_scrollback
mouse_map right click ungrabbed paste_from_clipboard

# Opacity control: Ctrl+Shift+A/Z
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+z set_background_opacity -0.05
map ctrl+shift+backspace set_background_opacity default

# New tab/window in current dir
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ── Performance ──
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Shell ──
shell_integration enabled
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
