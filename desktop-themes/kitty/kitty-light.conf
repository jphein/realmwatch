# ══════════════════════════════════════════════════════════════
#   REALM KITTY LIGHT — Enchanted Parchment Terminal
#   Sunlit vellum palette inspired by realm.watch
# ══════════════════════════════════════════════════════════════

# ── Font ──
font_family      Ubuntu Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ── Window: the Sunlit Grimoire ──
background_opacity 0.92
dynamic_background_opacity yes
window_padding_width 10 14
remember_window_size yes
initial_window_width  120c
initial_window_height 36c
confirm_os_window_close 0
linux_display_server wayland
window_border_width 1pt
active_border_color   #8a6520
inactive_border_color #ddd4c0
draw_minimal_borders  yes

# ── Colors: The Enchanted Parchment ──
foreground #1a1028
background #f5edd8

# Cursor: dark gold quill
cursor           #8a6520
cursor_text_color #f5edd8
cursor_shape     beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_trail 0

# Selection: warm gold wash
selection_foreground #1a1028
selection_background #dcc898

# Marks
mark1_foreground #f5edd8
mark1_background #8a6520
mark2_foreground #f5edd8
mark2_background #287848
mark3_foreground #f5edd8
mark3_background #6a3a90

# URL underline: dark gold
url_color #8a6520
url_style curly

# ── ANSI: Sunlit Gem Palette ──
# Black (ink)
color0  #2a2038
color8  #5a4a68

# Red (deep ruby)
color1  #a83030
color9  #c84040

# Green (deep emerald)
color2  #287848
color10 #1a6838

# Yellow (dark gold)
color3  #8a6520
color11 #6a4a10

# Blue (deep sapphire)
color4  #3a5a90
color12 #2a4a80

# Magenta (deep amethyst)
color5  #6a3a90
color13 #7a4aaa

# Cyan (deep teal)
color6  #1a7868
color14 #288a78

# White (parchment)
color7  #5a4a68
color15 #1a1028

# ── Scrollback ──
scrollback_lines 50000
scrollback_pager_history_size 64
scrollback_pager less -R +G
wheel_scroll_multiplier 3.0
scroll_on_output no

# ── Bell: sunlit flash ──
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #dcc898
bell_on_tab "✦ "

# ── Tab Bar: Sunlit Rune Bar ──
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        1
tab_bar_background      #f0e6d0
tab_bar_margin_height   2 0
tab_title_max_length    32
tab_title_template      " {index}: {(tab.active_wd or '/').replace('/home/jp', '~').rsplit('/', 1)[-1] or '~'} "
active_tab_title_template " {index}: {(tab.active_wd or '/').replace('/home/jp', '~').rsplit('/', 1)[-1] or '~'} "
active_tab_foreground   #6a4a10
active_tab_background   #ece3ce
active_tab_font_style   bold
inactive_tab_foreground #5a4a68
inactive_tab_background #f0e6d0
inactive_tab_font_style normal
tab_activity_symbol     "✦"

# ── Keyboard Shortcuts ──
# Scrollback (works even in alternate screen / Claude Code)
map ctrl+shift+h show_scrollback
mouse_map right click ungrabbed paste_from_clipboard

# Opacity control: Ctrl+Shift+A/Z
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+z set_background_opacity -0.05
map ctrl+shift+backspace set_background_opacity default

# New tab/window in current dir
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ── Performance ──
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Shell ──
shell_integration enabled
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
